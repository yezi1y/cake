<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAKE DAY 2.0</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4ddd3;
            color: #805951;
            font-family: "Courier New", sans-serif;
            padding: 20px;
        }

        .bakery {
            width: 460px;
            max-width: 100%;
            padding: 20px;
            background: #fff1e8;
            border: 3px solid #805951;
            box-shadow: 6px 6px 0 #c49b8e;
        }

        h1 {
            text-align: center;
            letter-spacing: 5px;
            margin: 5px 0;
        }

        p {
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }

        .stage {
            position: relative;
            width: 100%;
            margin: 18px auto;
            border: 3px solid #bc9386;
            overflow: hidden;
            cursor: crosshair;
            touch-action: manipulation;
        }

        #cake {
            display: block;
            width: 100%;
            image-rendering: pixelated;
        }

        #decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .emoji {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: "Apple Color Emoji",
            "Segoe UI Emoji",
            "Noto Color Emoji",
            sans-serif;
            line-height: 1;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
        }

        .emoji.focused {
            outline: 2px dashed #a65e80;
            outline-offset: 3px;
            border-radius: 4px;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 16px;
        }

        button {
            flex: 1;
            padding: 9px 6px;
            background: #fffaf4;
            color: #805951;
            border: 2px solid #d4b0a2;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #f9ded5;
        }

        button.selected {
            background: #f2c0ce;
            border-color: #b16e86;
        }

        #emojiTools {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
        }

        #emojiTools button {
            font-size: 25px;
            font-family: "Apple Color Emoji",
            "Segoe UI Emoji",
            "Noto Color Emoji",
            sans-serif;
        }

        label {
            font-size: 13px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #b16e86;
        }

        .size-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            background: #f7dfd7;
            padding: 10px;
            border: 1px dashed #bc9386;
            min-height: 40px;
        }

        .actions button {
            background: #805951;
            color: white;
            border-color: #805951;
        }

        footer {
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<div class="bakery">

    <h1>CAKE DAY</h1>
    <p>✦ LITTLE BAKERY STUDIO ✦</p>

    <div class="stage" id="stage">
        <canvas id="cake" width="128" height="112"></canvas>
        <div id="decorations"></div>
    </div>

    <label>01 / 蛋糕口味</label>
    <div class="bar" id="taste"></div>

    <label>02 / 奶油颜色</label>
    <div class="bar" id="cream"></div>

    <label>03 / 蛋糕层数</label>
    <div class="bar" id="layers"></div>

    <label>04 / 编辑模式</label>

    <div class="bar" id="modes">
        <button data-mode="add">添加</button>
        <button data-mode="move">移动</button>
        <button data-mode="erase">删除</button>
    </div>

    <p class="hint" id="hint"></p>

    <label>05 / Emoji 装饰</label>
    <div class="bar" id="emojiTools"></div>

    <div class="size-row">
        <label>06 / 装饰大小</label>
        <span id="sizeValue">28px</span>
    </div>

    <input
            type="range"
            id="size"
            min="12"
            max="60"
            value="28"
    >

    <div class="bar actions">
        <button id="undo">撤销</button>
        <button id="clear">重做</button>
        <button id="random">随机</button>
        <button id="save">保存</button>
    </div>

    <footer>MADE WITH SUGAR & PIXELS</footer>

</div>

<script>

    // =========================
    // 01. 初始化
    // =========================

    const canvas = document.getElementById("cake");
    const ctx = canvas.getContext("2d");

    const stage = document.getElementById("stage");
    const decorationLayer =
        document.getElementById("decorations");

    const sizeInput = document.getElementById("size");

    const tastes = [
        ["香草", "#e8bd80"],
        ["草莓", "#e79ca9"],
        ["巧克力", "#98674e"],
        ["抹茶", "#a5bc80"]
    ];

    const creams = [
        ["奶白", "#fff3d8"],
        ["粉色", "#f3b5cc"],
        ["薄荷", "#b6dec5"],
        ["香芋", "#cbb7e6"],
        ["蓝莓", "#b4d4ed"]
    ];

    const emojis = [
        "🍓", "🍒", "🎀", "🕯️", "🍫",
        "⭐", "🫐", "🍋", "🍑", "🍇",
        "🌸", "🌷", "🦋", "💗", "🍪",
        "🍬", "🍊", "🥝", "🍍", "🧸",
        "🍉", "🌼", "🍭", "✨", "🐰"
    ];

    let taste = 0;
    let cream = 1;
    let layers = 2;

    let selectedEmoji = 0;
    let mode = "add";
    let movingIndex = -1;

    let items = [];
    let history = [];

    // =========================
    // 02. 保存历史记录
    // =========================

    function saveHistory() {

        history.push(JSON.stringify({
            taste,
            cream,
            layers,
            items
        }));

// 最多保留100步操作

        if (history.length > 100) {
            history.shift();
        }
    }

    // =========================
    // 03. 绘制像素蛋糕
    // =========================

    function rect(x, y, w, h, color) {

        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }

    function drawCake() {

// 背景

        rect(0, 0, 128, 112, "#fbe4db");

        for (let y = 0; y < 92; y += 8) {

            for (let x = 0; x < 128; x += 8) {

                if ((x / 8 + y / 8) % 2 === 0) {

                    rect(x, y, 8, 8, "#f5d8cf");

                }
            }
        }

// 桌面

        rect(0, 92, 128, 20, "#d7b39a");
        rect(15, 94, 98, 4, "#c39786");

// 托盘

        rect(12, 88, 104, 4, "#9d7773");
        rect(16, 85, 96, 5, "#fff9ed");

// 蛋糕

        for (let i = 0; i < layers; i++) {

            const w = 84 - i * 22;
            const x = (128 - w) / 2;
            const y = 85 - (i + 1) * 20;

// 轮廓

            rect(x - 1, y + 2, w + 2, 18, "#956d60");

// 蛋糕胚

            rect(x, y + 2, w, 16, tastes[taste][1]);

// 夹心

            rect(x + 2, y + 12, w - 4, 3, creams[cream][1]);

// 奶油

            rect(x, y + 1, w, 6, creams[cream][1]);

            rect(x + 3, y - 1, w - 6, 4, creams[cream][1]);

// 高光

            rect(x + 4, y, w - 8, 1, "#fffaf0");

// 奶油滴落

            for (let j = 3; j < w - 4; j += 9) {

                rect(
                    x + j,
                    y + 7,
                    4,
                    4,
                    creams[cream][1]
                );
            }
        }
    }

    // =========================
    // 04. 绘制 Emoji 装饰
    // =========================

    function drawDecorations() {

        decorationLayer.innerHTML = "";

        items.forEach((item, index) => {

            const emoji = document.createElement("span");

            emoji.className = "emoji";

            emoji.textContent = item.symbol;

            emoji.style.left = item.x + "%";
            emoji.style.top = item.y + "%";
            emoji.style.fontSize = item.size + "px";

// 选中的装饰显示虚线框

            if (mode === "move" && movingIndex === index) {

                emoji.classList.add("focused");

            }

            emoji.addEventListener("click", event => {

                event.stopPropagation();

// 删除模式

                if (mode === "erase") {

                    saveHistory();

                    items.splice(index, 1);

                    movingIndex = -1;

                    render();

                    return;
                }

// 移动模式

                if (mode === "move") {

                    movingIndex =
                        movingIndex === index ? -1 : index;

                    render();

                    return;
                }

// 添加模式允许叠加装饰

                if (mode === "add") {

                    placeEmoji(event);

                }
            });

            decorationLayer.appendChild(emoji);

        });
    }

    // =========================
    // 05. 点击放置或移动
    // =========================

    function placeEmoji(event) {

        const bounds =
            decorationLayer.getBoundingClientRect();

        const x = Math.max(
            0,
            Math.min(
                100,
                (event.clientX - bounds.left)
                / bounds.width * 100
            )
        );

        const y = Math.max(
            0,
            Math.min(
                100,
                (event.clientY - bounds.top)
                / bounds.height * 100
            )
        );

// 添加模式

        if (mode === "add") {

            saveHistory();

            items.push({
                x,
                y,
                symbol: emojis[selectedEmoji],
                size: Number(sizeInput.value)
            });
        }

// 移动模式

        if (mode === "move" && movingIndex !== -1) {

            saveHistory();

            items[movingIndex].x = x;
            items[movingIndex].y = y;

            movingIndex = -1;
        }

        render();
    }

    stage.addEventListener("click", placeEmoji);

    // =========================
    // 06. 编辑模式
    // =========================

    function setMode(newMode) {

        mode = newMode;
        movingIndex = -1;

        render();
    }

    document.querySelectorAll("#modes button")
        .forEach(button => {

            button.onclick = () => {

                setMode(button.dataset.mode);

            };
        });

    function updateHint() {

        const hint = document.getElementById("hint");

        if (mode === "add") {

            hint.textContent =
                "当前装饰：" + emojis[selectedEmoji]
                + "，点击蛋糕摆放";

        } else if (mode === "move") {

            hint.textContent = movingIndex === -1
                ? "点击想要移动的装饰"
                : "已选中装饰，请点击新的位置";

        } else {

            hint.textContent =
                "点击想要删除的装饰";

        }
    }

    // =========================
    // 07. 创建选项按钮
    // =========================

    function options(id, array, get, set) {

        const element = document.getElementById(id);

        array.forEach((item, index) => {

            const button = document.createElement("button");

            button.textContent = Array.isArray(item)
                ? item[0]
                : item;

            button.onclick = () => {

                if (id !== "emojiTools" && index !== get()) {

                    saveHistory();

                }

                set(index);

                render();
            };

            element.appendChild(button);

        });

        element.refresh = () => {

            [...element.children].forEach((button, index) => {

                button.classList.toggle(
                    "selected",
                    index === get()
                );
            });
        };
    }

    options(
        "taste",
        tastes,
        () => taste,
        i => taste = i
    );

    options(
        "cream",
        creams,
        () => cream,
        i => cream = i
    );

    options(
        "layers",
        ["一层", "两层", "三层"],
        () => layers - 1,
        i => layers = i + 1
    );

    options(
        "emojiTools",
        emojis,
        () => selectedEmoji,
        i => {

            selectedEmoji = i;

// 选择Emoji自动进入添加模式

            mode = "add";
            movingIndex = -1;
        }
    );

    // =========================
    // 08. 调整装饰大小
    // =========================

    sizeInput.addEventListener("input", () => {

        document.getElementById("sizeValue").textContent =
            sizeInput.value + "px";

    });

    // =========================
    // 09. 更新游戏画面
    // =========================

    function render() {

        drawCake();
        drawDecorations();
        updateHint();

        ["taste", "cream", "layers", "emojiTools"]
            .forEach(id => {

                document.getElementById(id).refresh();

            });

        document.querySelectorAll("#modes button")
            .forEach(button => {

                button.classList.toggle(
                    "selected",
                    button.dataset.mode === mode
                );
            });
    }

    // =========================
    // 10. 撤销
    // =========================

    document.getElementById("undo").onclick = () => {

        if (history.length === 0) {
            return;
        }

        const previous = JSON.parse(history.pop());

        taste = previous.taste;
        cream = previous.cream;
        layers = previous.layers;
        items = previous.items;

        movingIndex = -1;

        render();
    };

    // =========================
    // 11. 重新制作
    // =========================

    document.getElementById("clear").onclick = () => {

        saveHistory();

        items = [];

        taste = 0;
        cream = 1;
        layers = 2;

        mode = "add";
        movingIndex = -1;

        render();
    };

    // =========================
    // 12. 随机蛋糕
    // =========================

    document.getElementById("random").onclick = () => {

        saveHistory();

        taste = Math.floor(Math.random() * tastes.length);

        cream = Math.floor(Math.random() * creams.length);

        layers = 1 + Math.floor(Math.random() * 3);

        items = [];

        const symbol = emojis[
            Math.floor(Math.random() * emojis.length)
            ];

        const width = 84 - (layers - 1) * 22;

        const y = (85 - layers * 20 - 5) / 112 * 100;

        for (
            let x = 64 - width / 2 + 8;
            x < 64 + width / 2 - 3;
            x += 14
        ) {

            items.push({
                x: x / 128 * 100,
                y: y,
                symbol: symbol,
                size: 24
            });
        }

        mode = "add";
        movingIndex = -1;

        render();
    };

    // =========================
    // 13. 保存高清PNG
    // =========================

    document.getElementById("save").onclick = () => {

        const output = document.createElement("canvas");

        output.width = 1024;
        output.height = 896;

        const out = output.getContext("2d");

        out.imageSmoothingEnabled = false;

// 绘制像素蛋糕

        out.drawImage(
            canvas,
            0,
            0,
            output.width,
            output.height
        );

// 合成Emoji装饰

        const scale =
            output.width / decorationLayer.clientWidth;

        out.textAlign = "center";
        out.textBaseline = "middle";

        items.forEach(item => {

            out.font =
                `${item.size * scale}px "Apple Color Emoji",
"Segoe UI Emoji",
"Noto Color Emoji",
sans-serif`;

            out.fillText(
                item.symbol,
                item.x / 100 * output.width,
                item.y / 100 * output.height
            );

        });

// 下载图片

        const link = document.createElement("a");

        link.download = "cake-day.png";

        link.href = output.toDataURL("image/png");

        link.click();
    };

    // 启动游戏

    render();

</script>

</body>
</html>
